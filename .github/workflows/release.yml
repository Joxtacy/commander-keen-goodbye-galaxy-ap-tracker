name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          # Allow an optional prerelease suffix (e.g. 0.2.0-rc.1). A suffixed
          # version is published as a GitHub prerelease (see "Create release"),
          # so it never becomes releases/latest and is safe to hand out for testing.
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version must be semver, optionally with a prerelease suffix (e.g. 0.1.0 or 0.2.0-rc.1)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      # Gate the release on the same checks CI runs, so a dispatch on an
      # unvetted ref can't ship a broken pack or one that has drifted from the
      # apworld. Runs before any manifest/versions mutation so it fails fast.
      - name: Checkout apworld (Joxtacy/Archipelago-Keen@keen-ap)
        uses: actions/checkout@v6
        with:
          repository: Joxtacy/Archipelago-Keen
          ref: keen-ap
          path: _apworld

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate (lua syntax + logic tests + apworld drift)
        run: |
          for f in scripts/init.lua scripts/logic.lua scripts/autotracking.lua; do luac5.4 -p "$f"; done
          lua5.4 tools/test_logic.lua
          python3 tools/check_drift.py --apworld _apworld

      - name: Update manifest.json version
        run: |
          jq --arg v "${{ inputs.version }}" '.package_version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Generate changelog
        id: changelog
        run: |
          # Exclude prerelease tags (anything with a hyphen, e.g. v0.2.0-rc.1) so a
          # final release's changelog spans the whole feature set, not just the
          # commits since the last RC.
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          ZIP_NAME="keen_goodbye_galaxy_ap_tracker_${{ inputs.version }}.zip"
          zip -r "$ZIP_NAME" \
            manifest.json \
            versions.json \
            items/ \
            locations/ \
            layouts/ \
            maps/ \
            images/ \
            scripts/ \
            -x "scripts/map_coords.py"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Prepend entry to versions.json
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          SHA=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/${ZIP_NAME}"
          CHANGELOG_JSON=$(printf '%s' "$CHANGELOG" | jq -R -s 'split("\n") | map(ltrimstr("- ")) | map(select(. != ""))')
          jq --arg v "${{ inputs.version }}" \
             --arg url "$DOWNLOAD_URL" \
             --arg sha "$SHA" \
             --argjson cl "$CHANGELOG_JSON" \
             '.versions = [{package_version: $v, download_url: $url, sha256: $sha, changelog: $cl}] + (.versions // [])' \
             versions.json > versions.tmp && mv versions.tmp versions.json

      - name: Commit version bumps, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json / versions.json, skipping commit"
          else
            git commit -m "chore: release v${{ inputs.version }}"
            # Persisting the bump back to a branch is bookkeeping only — PopTracker
            # reads versions.json from the latest release asset, not from a branch.
            # When dispatched on a tag there is no branch to push to (and an
            # unqualified HEAD:<tag> push would create a stray branch), so skip it.
            if [ "${{ github.ref_type }}" = "branch" ]; then
              git push origin "HEAD:${{ github.ref_name }}"
            else
              echo "Dispatched on a ${{ github.ref_type }} (${{ github.ref_name }}); skipping branch push."
            fi
          fi
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          # A version with a prerelease suffix (e.g. 0.2.0-rc.1) is marked as a
          # prerelease so releases/latest — and thus the public versions_url that
          # PopTracker reads — keeps pointing at the last real release.
          prerelease: ${{ contains(inputs.version, '-') }}
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
          files: |
            ${{ env.ZIP_NAME }}
            versions.json
